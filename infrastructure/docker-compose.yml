# Development-only database scaffold. Do not expose this to the internet.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: e_electric
      POSTGRES_USER: e_electric
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e_electric -d e_electric"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
